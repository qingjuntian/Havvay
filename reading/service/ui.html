<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Studio</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f1eb;
      --surface: #fffefa;
      --ink: #202823;
      --muted: #68736c;
      --line: #d9ddd5;
      --green: #1f5a47;
      --green-soft: #e6f0e9;
      --coral: #c66b4e;
      --coral-soft: #f7e9e3;
      --gold: #d3a64b;
      --shadow: 0 12px 34px rgb(31 54 43 / 7%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
    aside {
      background: #e8ece5;
      border-right: 1px solid var(--line);
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
    .brand-mark { width: 35px; height: 35px; border-radius: 11px 11px 11px 3px; background: var(--green); position: relative; }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; left: 9px; right: 8px; height: 2px; background: #f3d98c; transform: rotate(-18deg); }
    .brand-mark::before { top: 13px; }
    .brand-mark::after { top: 20px; right: 13px; }
    .brand strong { display: block; font-size: 16px; letter-spacing: 0; }
    .brand small { color: var(--muted); font-size: 11px; }
    .upload-box { background: var(--surface); padding: 16px; border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
    .upload-box h2 { margin: 0 0 12px; font-size: 14px; }
    .upload-box input[type=file] { width: 100%; font-size: 12px; color: var(--muted); }
    .upload-box input[type=text] { width: 100%; height: 38px; margin: 11px 0; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; }
    .upload-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 12px; padding: 3px; background: #e9ece6; border-radius: 4px; }
    .upload-mode button { min-height: 34px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 11px; }
    .upload-mode button[aria-pressed="true"] { background: var(--surface); color: var(--green); box-shadow: 0 1px 3px rgb(31 54 43 / 12%); }
    .upload-fields[hidden] { display: none; }
    .upload-hint { margin: 8px 0; color: var(--muted); font-size: 11px; }
    .primary, .secondary { border: 0; border-radius: 4px; min-height: 38px; padding: 0 13px; }
    .primary { background: var(--green); color: white; }
    .primary:hover { background: #174835; }
    .secondary { background: var(--green-soft); color: var(--green); }
    .secondary:hover { background: #d5e7da; }
    .book-nav { min-height: 0; overflow: auto; }
    .nav-label { margin: 0 8px 9px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .book-list { display: grid; gap: 5px; }
    .book-row { display: flex; align-items: stretch; gap: 4px; min-width: 0; }
    .book-item { flex: 1; min-width: 0; width: auto; text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 4px; padding: 10px 9px; }
    .book-item:hover, .book-item.active { background: var(--surface); border-color: var(--line); }
    .book-item strong { display: block; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; }
    .book-item small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .book-delete { align-self: center; flex: 0 0 auto; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #9b4938; padding: 6px 7px; font-size: 11px; }
    .book-delete:hover, .book-delete:focus-visible { border-color: #e3b5a8; background: var(--coral-soft); }
    main { min-width: 0; padding: 31px clamp(18px, 4vw, 56px) 55px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 25px; }
    .eyebrow { color: var(--coral); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.2; overflow-wrap: anywhere; }
    .refresh { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); padding: 8px 12px; }
    .status-line { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .status-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--gold); }
    .status-dot.ready { background: var(--green); }
    .workflow-status { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 11px; align-items: start; margin: 0 0 20px; padding: 14px 16px; border: 1px solid #d9c998; border-left: 4px solid var(--gold); border-radius: 4px; background: #fbf7e9; }
    .workflow-status[data-tone="active"] { border-color: #b8d1c1; border-left-color: var(--green); background: #eef5ef; }
    .workflow-status[data-tone="error"] { border-color: #e3b5a8; border-left-color: var(--coral); background: #fbefeb; }
    .workflow-status-mark { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--gold); }
    .workflow-status[data-tone="active"] .workflow-status-mark { background: var(--green); }
    .workflow-status[data-tone="error"] .workflow-status-mark { background: var(--coral); }
    .workflow-status-title { margin: 0; font-size: 15px; font-weight: 700; }
    .workflow-status-detail { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .workflow-progress { grid-column: 2; width: 100%; height: 5px; margin-top: 7px; overflow: hidden; border: 0; border-radius: 0; accent-color: var(--green); }
    .workflow-progress-indeterminate { grid-column: 2; height: 4px; margin-top: 7px; overflow: hidden; background: #e0dfd6; }
    .workflow-progress-indeterminate::after { content: ""; display: block; width: 38%; height: 100%; background: var(--gold); animation: workflow-progress 1.4s ease-in-out infinite alternate; }
    @keyframes workflow-progress { from { transform: translateX(0); } to { transform: translateX(165%); } }
    .workflow-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 0 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .workflow-tab { min-width: 0; padding: 11px 9px 9px; color: #68736c; border: 0; border-bottom: 3px solid transparent; background: transparent; text-align: left; font-size: 13px; }
    .workflow-tab[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); font-weight: 700; }
    .workflow-tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
    .workflow-panel[hidden] { display: none; }
    .workflow-panel { min-width: 0; }
    .section { margin-top: 24px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 11px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .section-head small { color: var(--muted); }
    .image-page-composer { max-width: 920px; padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    .image-page-composer > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .image-page-composer input[type=file] { max-width: 100%; }
    .image-page-composer .image-page-inputs { display: grid; gap: 12px; margin: 14px 0; }
    .image-page-input { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr); gap: 14px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
    .image-page-input img { width: 100%; height: 160px; object-fit: contain; background: #e9e6dc; }
    .image-page-input label { display: block; margin-bottom: 6px; overflow-wrap: anywhere; color: var(--muted); font-size: 12px; }
    .image-page-input textarea { min-height: 125px; padding: 10px; font: 14px/1.7 "Avenir Next", "PingFang SC", sans-serif; }
    .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 13px; }
    .page-item { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px; box-shadow: var(--shadow); }
    .page-zoom { display: block; width: 100%; padding: 0; border: 0; background: transparent; }
    .page-zoom:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .page-item img { display: block; width: 100%; height: 225px; object-fit: contain; background: #e9e6dc; }
    .page-item figcaption { color: var(--muted); padding: 7px 1px 1px; font-size: 11px; }
    .page-item-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .page-action { min-height: 34px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--green); font-size: 12px; }
    .page-action:hover:not(:disabled) { background: var(--green-soft); }
    .page-action:disabled { opacity: 0.5; cursor: default; }
    .page-viewer { width: min(96vw, 1280px); height: min(94vh, 1100px); max-width: none; max-height: none; padding: 14px; border: 1px solid #48524b; border-radius: 5px; background: #202823; color: #fffefa; }
    .page-viewer::backdrop { background: rgb(12 17 14 / 82%); }
    .page-viewer[open] { display: flex; flex-direction: column; }
    .viewer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
    .viewer-toolbar p { margin: 0; font-size: 13px; }
    .viewer-actions { display: flex; gap: 8px; }
    .viewer-actions button { min-height: 36px; padding: 0 11px; border: 1px solid #68736c; border-radius: 3px; background: #303b34; color: #fffefa; }
    .viewer-actions button:hover:not(:disabled) { background: #405047; }
    .viewer-actions button:disabled { opacity: 0.45; cursor: default; }
    .page-viewer-image { display: block; min-height: 0; width: 100%; height: 100%; object-fit: contain; background: #171d19; }
    .page-text-dialog:not([open]) { display: none; }
    .page-text-dialog[open] { display: flex; flex-direction: column; box-sizing: border-box; width: min(92vw, 760px); height: min(82vh, 720px); max-width: none; max-height: 90vh; overflow: hidden; padding: 18px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); }
    .page-text-dialog::backdrop { background: rgb(12 17 14 / 55%); }
    .page-text-dialog h2 { margin: 0 0 10px; font-size: 17px; }
    .page-text-dialog textarea { flex: 1 1 auto; width: 100%; height: auto; min-height: 0; max-height: none; overflow-y: auto; overscroll-behavior-y: contain; resize: none; font: 15px/1.8 "Avenir Next", "PingFang SC", sans-serif; }
    .page-text-dialog .actions { flex: 0 0 auto; }
    .text-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
    .checklist-panel { margin-top: 12px; padding: 11px; border-left: 3px solid var(--gold); background: #f7f4e8; }
    .checklist-panel > p { margin: 0 0 8px; font-size: 12px; }
    .checklist-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .checklist-item { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .checklist-item span { min-width: 0; overflow-wrap: anywhere; font-size: 12px; }
    .checklist-item button { flex: 0 0 auto; padding: 3px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--green); font-size: 11px; }
    .checklist-item button:disabled { opacity: 0.55; cursor: default; }
    textarea { display: block; width: 100%; min-height: 280px; resize: vertical; border: 1px solid var(--line); border-radius: 3px; padding: 12px; color: var(--ink); background: #fff; font: 13px/1.8 "SFMono-Regular", Consolas, monospace; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
    .events { border-left: 2px solid var(--line); margin: 8px 0 0 5px; padding: 1px 0 1px 16px; display: grid; gap: 11px; }
    .event { color: var(--muted); font-size: 12px; }
    .event strong { color: var(--ink); font-weight: 600; }
    .empty { min-height: 55vh; display: grid; align-content: center; justify-items: center; text-align: center; color: var(--muted); }
    .empty-mark { width: 76px; height: 95px; margin-bottom: 15px; border: 1px solid #aeb8ae; border-radius: 3px 12px 12px 3px; background: linear-gradient(90deg, #dce6dc 0 9px, #fffefa 9px); box-shadow: 10px 8px 0 -3px #d6b978; transform: rotate(-4deg); }
    .notice { color: var(--muted); font-size: 12px; margin: 7px 0 0; }
    .app-toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; width: max-content; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; border: 1px solid #a9c8b3; border-radius: 4px; background: #edf5ef; color: var(--green); box-shadow: var(--shadow); font-size: 13px; overflow-wrap: anywhere; }
    .app-toast[data-tone="error"] { border-color: #e3b5a8; background: var(--coral-soft); color: #8f3d2d; }
    .app-toast[hidden] { display: none; }
    .media-player { display: block; width: min(100%, 760px); margin-top: 8px; background: #202823; border-radius: 4px; }
    .reference-form { display: grid; gap: 10px; max-width: 760px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
    .reference-form input[type=file] { max-width: 100%; }
    .reference-form textarea { min-height: 86px; }
    .reference-form button { justify-self: start; }
    .pronunciation-editor { max-width: 760px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    .pronunciation-editor p { margin: 0 0 9px; color: var(--muted); font-size: 12px; }
    .pronunciation-editor textarea { min-height: 112px; max-height: 260px; }
    #message { min-height: 20px; margin-top: 8px; color: var(--coral); font-size: 12px; }
    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 15px; gap: 13px; }
      .upload-box { padding: 12px; }
      .book-nav { max-height: 160px; }
      main { padding: 22px 15px 38px; }
      .workflow-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-grid { grid-template-columns: 1fr; }
      .page-item img { height: 225px; }
      .page-text-dialog { width: min(94vw, 760px); height: 90vh; max-height: 90vh; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>Reading Studio</strong><small>BOOK PRODUCTION</small></div></div>
      <form class="upload-box" id="upload-form">
        <h2>新建书籍</h2>
        <div class="upload-mode" role="group" aria-label="书籍内容来源">
          <button type="button" data-upload-mode="pdf" aria-pressed="true">排版 PDF</button>
          <button type="button" data-upload-mode="images" aria-pressed="false">图片 + 文本</button>
        </div>
        <div id="pdf-upload-fields" class="upload-fields">
          <input type="file" name="pdf" accept="application/pdf,.pdf" required aria-label="选择排版好的 PDF">
        </div>
        <div id="image-upload-fields" class="upload-fields" hidden>
          <p class="upload-hint">先创建书籍，再从右侧工作区添加图片和对应文本。</p>
        </div>
        <input type="text" name="title" placeholder="书名（可选）" aria-label="书名">
        <button class="primary" id="upload-submit" type="submit">上传 PDF 并开始处理</button>
        <div id="message" role="status"></div>
      </form>
      <nav class="book-nav" aria-label="书籍列表">
        <p class="nav-label">书籍工作区</p>
        <div class="book-list" id="book-list"></div>
      </nav>
    </aside>
    <main id="main">
      <div class="empty"><div class="empty-mark" aria-hidden="true"></div><h1>选择一本书开始审核</h1><p>上传排版 PDF，或选择图片并填写每页文本。</p></div>
    </main>
  </div>
  <div class="app-toast" id="app-toast" role="status" aria-live="polite" hidden></div>
  <dialog class="page-viewer" id="page-viewer" aria-label="页面图片放大查看">
    <div class="viewer-toolbar">
      <p id="page-viewer-label"></p>
      <div class="viewer-actions">
        <button type="button" id="page-viewer-prev" aria-label="上一页">上一页</button>
        <button type="button" id="page-viewer-next" aria-label="下一页">下一页</button>
        <button type="button" id="page-viewer-close" aria-label="关闭放大预览">关闭</button>
      </div>
    </div>
    <img class="page-viewer-image" id="page-viewer-image" alt="">
  </dialog>
  <dialog class="page-text-dialog" id="page-text-dialog" aria-labelledby="page-text-dialog-title">
    <h2 id="page-text-dialog-title">编辑页面文字</h2>
    <textarea id="page-text-dialog-input" aria-label="当前页面朗读文本"></textarea>
    <div class="actions">
      <button type="button" class="secondary" id="page-text-dialog-cancel">取消</button>
      <button type="button" class="primary" id="page-text-dialog-save">保存本页文字</button>
    </div>
  </dialog>
  <script>
    const listNode = document.querySelector("#book-list");
    const mainNode = document.querySelector("#main");
    const messageNode = document.querySelector("#message");
    const appToast = document.querySelector("#app-toast");
    const pageViewer = document.querySelector("#page-viewer");
    const pageViewerImage = document.querySelector("#page-viewer-image");
    const pageViewerLabel = document.querySelector("#page-viewer-label");
    const pageViewerPrevious = document.querySelector("#page-viewer-prev");
    const pageViewerNext = document.querySelector("#page-viewer-next");
    const pageTextDialog = document.querySelector("#page-text-dialog");
    const pageTextDialogTitle = document.querySelector("#page-text-dialog-title");
    const pageTextDialogInput = document.querySelector("#page-text-dialog-input");
    const pageTextDialogSave = document.querySelector("#page-text-dialog-save");
    let editingBookId = null;
    let editingPageNumber = null;
    let editingPageText = "";
    const pdfUploadFields = document.querySelector("#pdf-upload-fields");
    const imageUploadFields = document.querySelector("#image-upload-fields");
    const uploadSubmit = document.querySelector("#upload-submit");
    let activeBookId = null;
    let activeStatus = "";
    const activeWorkflowTabs = new Map();
    const pronunciationMessages = new Map();
    let appToastTimer = null;
    let uploadMode = "pdf";
    let viewerPages = [];
    let viewerPageIndex = 0;

    function showViewerPage(index) {
      viewerPageIndex = Math.max(0, Math.min(index, viewerPages.length - 1));
      const artifact = viewerPages[viewerPageIndex];
      pageViewerImage.src = artifact.url;
      pageViewerImage.alt = `第 ${artifact.metadata.page} 页放大预览`;
      pageViewerLabel.textContent = `第 ${artifact.metadata.page} 页 / 共 ${viewerPages.length} 页`;
      pageViewerPrevious.disabled = viewerPageIndex === 0;
      pageViewerNext.disabled = viewerPageIndex === viewerPages.length - 1;
    }

    function openPageViewer(pages, index) {
      viewerPages = pages;
      showViewerPage(index);
      pageViewer.showModal();
    }

    pageViewerPrevious.addEventListener("click", () => showViewerPage(viewerPageIndex - 1));
    pageViewerNext.addEventListener("click", () => showViewerPage(viewerPageIndex + 1));
    document.querySelector("#page-viewer-close").addEventListener("click", () => pageViewer.close());
    document.querySelector("#page-text-dialog-cancel").addEventListener("click", () => pageTextDialog.close());
    pageTextDialogSave.addEventListener("click", async () => {
      if (!editingBookId || !editingPageNumber || !pageTextDialogInput.value.trim()) {
        messageNode.textContent = "本页朗读文字不能为空";
        return;
      }
      pageTextDialogSave.disabled = true;
      try {
        const result = await api(`/api/books/${editingBookId}/pages/${editingPageNumber}/text`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: pageTextDialogInput.value }),
        });
        messageNode.textContent = result.text_changed
          ? `第 ${editingPageNumber} 页已保存。需要生成时，请使用“生成与更新”中的统一按钮。`
          : result.review_complete
            ? `第 ${editingPageNumber} 页已保存确认，全部页面文字已完成`
            : `第 ${editingPageNumber} 页已保存确认，已完成 ${result.confirmed_page_count}/${result.page_count} 页`;
        pageTextDialog.close();
        await loadBooks();
      } catch (error) {
        messageNode.textContent = error.message;
      } finally {
        pageTextDialogSave.disabled = false;
      }
    });
    pageViewer.addEventListener("click", event => {
      if (event.target === pageViewer) pageViewer.close();
    });
    document.addEventListener("keydown", event => {
      if (!pageViewer.open) return;
      if (event.key === "Escape") {
        event.preventDefault();
        pageViewer.close();
      } else if (event.key === "ArrowLeft") {
        showViewerPage(viewerPageIndex - 1);
      } else if (event.key === "ArrowRight") {
        showViewerPage(viewerPageIndex + 1);
      } else if (event.key === "Home") {
        showViewerPage(0);
      } else if (event.key === "End") {
        showViewerPage(viewerPages.length - 1);
      }
    });

    document.querySelectorAll("[data-upload-mode]").forEach(button => {
      button.addEventListener("click", () => {
        uploadMode = button.dataset.uploadMode;
        document.querySelectorAll("[data-upload-mode]").forEach(item => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        pdfUploadFields.hidden = uploadMode !== "pdf";
        imageUploadFields.hidden = uploadMode !== "images";
        document.querySelector('input[name="pdf"]').required = uploadMode === "pdf";
        uploadSubmit.textContent = uploadMode === "pdf" ? "上传 PDF 并开始处理" : "创建图片书籍";
      });
    });

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      const body = response.headers.get("content-type")?.includes("application/json") ? await response.json() : null;
      if (!response.ok) throw new Error(body?.detail || body?.error || response.statusText);
      return body;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showAppToast(message, tone = "success") {
      window.clearTimeout(appToastTimer);
      appToast.textContent = message;
      appToast.dataset.tone = tone;
      appToast.hidden = false;
      appToastTimer = window.setTimeout(() => { appToast.hidden = true; }, 5000);
    }

    function textStatsLabel(book) {
      if (book.text_char_count === null || book.text_char_count === undefined) return "文本待生成";
      const count = new Intl.NumberFormat("zh-CN").format(book.text_char_count);
      return `${count} 字 · ${book.page_count} 页`;
    }

    function workflowStageLabel(stage) {
      return ({
        document: "PDF 页面解析", pages_review: "页面审核", text_review: "文本审核",
        reference: "参考声音", reference_preparation: "参考声音处理", reference_review: "参考声音审核",
        preview_audio: "前五页音频生成", preview_audio_update: "预览音频更新", preview_audio_review: "前五页音频审核",
        preview_video: "预览视频生成", preview_video_review: "预览视频审核", full_audio: "全书音频生成",
        full_audio_update: "全书音频更新", final_audio_review: "全书音频审核", full_video: "最终视频生成",
        final_video_review: "最终视频审核", complete: "全书成品",
      })[stage] || stage;
    }

    function workflowStatusLabel(status) {
      if (status.startsWith("awaiting_")) return "等待审核或输入";
      return ({
        uploaded: "已上传", queued: "排队中", running: "处理中", preparing: "准备中",
        ready: "准备就绪", failed: "处理失败", queue_unavailable: "队列不可用", complete: "已完成",
      })[status] || status;
    }

    function workflowStatusCopy(book) {
      const activeJob = [...book.jobs].reverse().find(job => job.stage === book.current_stage && ["queued", "running"].includes(job.status));
      if (book.status === "queued" || activeJob?.status === "queued") {
        return {
          tone: "waiting", title: `${workflowStageLabel(book.current_stage)}：正在排队`,
          detail: book.current_stage === "document"
            ? "PDF 已上传，页面图片和文本尚未生成，后台任务开始后会自动更新状态。"
            : "当前步骤已加入后台队列，开始处理后会自动更新状态。",
          indeterminate: true,
        };
      }
      if (["running", "preparing"].includes(book.status) || activeJob?.status === "running") {
        const progress = Number(activeJob?.progress || 0);
        return {
          tone: "active", title: `正在处理：${workflowStageLabel(book.current_stage)}`,
          detail: progress > 0 ? `后台任务进行中 · ${Math.round(progress * 100)}%` : "后台任务进行中，完成后会自动进入下一审核阶段。",
          progress: progress > 0 ? progress * 100 : null,
          indeterminate: progress <= 0,
        };
      }
      if (["failed", "queue_unavailable"].includes(book.status)) {
        const failedJob = [...book.jobs].reverse().find(job => job.stage === book.current_stage && job.status === "failed");
        return {
          tone: "error", title: book.status === "failed" ? `${workflowStageLabel(book.current_stage)}失败` : "后台队列暂不可用",
          detail: failedJob?.error || "可以检查环境后重试当前步骤。",
        };
      }
      const approvalCopy = ({
        awaiting_image_pages: ["等待添加页面", "选择页面图片并填写对应文本后即可开始处理。"],
        awaiting_page_review: ["页面已准备好，等待审核", "检查页面图片和提取的文本，确认后继续。"],
        awaiting_text_review: ["朗读文本已准备好，等待审核", "检查并确认每页朗读文本后继续。"],
        awaiting_reference: ["页面与文本已准备好，等待参考声音", "上传声音样本并填写与录音一致的 REF_TEXT。"],
        awaiting_reference_review: ["参考声音已处理，等待试听确认", "确认处理后的声音和转写，再开始预览生成。"],
        awaiting_preview_audio_review: ["前五页试听已完成，等待审核", "试听预览音频并确认后继续生成预览视频。"],
        awaiting_preview_video_review: ["五页预览视频已完成，等待审核", "检查预览视频并确认后继续生成全书成品。"],
        awaiting_final_audio_review: ["全书音频已完成，等待审核", "确认全书音频后继续生成最终视频。"],
        awaiting_final_video_review: ["全书视频已完成，等待最终确认", "检查最终成品并确认完成。"],
      })[book.status];
      if (approvalCopy) return { tone: "waiting", title: approvalCopy[0], detail: approvalCopy[1] };
      if (book.current_stage === "complete" || book.status === "complete") {
        return { tone: "active", title: "全书成品已完成", detail: "音频和视频已准备好，可在“全书成品”标签中查看。" };
      }
      return { tone: "active", title: `${workflowStageLabel(book.current_stage)}：${workflowStatusLabel(book.status)}`, detail: "书籍状态已更新。" };
    }

    async function loadBooks() {
      const books = await api("/api/books");
      listNode.replaceChildren();
      for (const book of books) {
        const row = element("div", "book-row");
        const button = element("button", `book-item${book.id === activeBookId ? " active" : ""}`);
        button.type = "button";
        button.dataset.bookId = book.id;
        button.append(
          element("strong", "", book.title),
          element("small", "", `${textStatsLabel(book)} · ${workflowStageLabel(book.current_stage)} · ${workflowStatusLabel(book.status)}`),
        );
        button.addEventListener("click", () => openBook(book.id));
        const remove = element("button", "book-delete", "删除");
        remove.type = "button";
        remove.setAttribute("aria-label", `删除书籍《${book.title}》及其所有文件`);
        remove.title = "删除这本书及其所有上传和生成文件";
        remove.addEventListener("click", () => deleteBook(book));
        row.append(button, remove);
        listNode.append(row);
      }
      if (activeBookId) openBook(activeBookId);
    }

    async function deleteBook(book) {
      const confirmed = window.confirm(
        `确定永久删除《${book.title}》吗？\n\n此操作会删除这本书的上传文件、生成的音视频、页面图片、处理记录和确认记录，且无法撤销。`,
      );
      if (!confirmed) return;
      try {
        await api(`/api/books/${book.id}`, { method: "DELETE" });
        if (activeBookId === book.id) {
          activeBookId = null;
          mainNode.replaceChildren();
          const empty = element("div", "empty");
          empty.append(
            element("div", "empty-mark"),
            element("h1", "", "选择一本书开始审核"),
            element("p", "", "上传排版 PDF，或选择图片并填写每页文本。"),
          );
          mainNode.append(empty);
        }
        await loadBooks();
        showAppToast(`《${book.title}》及其文件已删除`);
      } catch (error) {
        showAppToast(error.message, "error");
      }
    }

    function latestArtifact(book, stage, kind) {
      return book.artifacts
        .filter(item => item.stage === stage && item.kind === kind && !item.stale)
        .sort((a, b) => b.version - a.version)[0];
    }

    function latestPageImages(book) {
      const pages = new Map();
      for (const artifact of book.artifacts) {
        if (artifact.stage !== "pages" || artifact.kind !== "page_image" || artifact.stale) continue;
        const pageNumber = artifact.metadata.page;
        const current = pages.get(pageNumber);
        if (!current || artifact.version > current.version) pages.set(pageNumber, artifact);
      }
      return [...pages.values()].sort((left, right) => left.metadata.page - right.metadata.page);
    }

    function addSection(parent, title, detail) {
      const section = element("section", "section");
      const head = element("div", "section-head");
      head.append(element("h2", "", title));
      if (detail) head.append(element("small", "", detail));
      section.append(head);
      parent.append(section);
      return section;
    }

    function appendProcessingEvents(parent, book) {
      const eventSection = addSection(parent, "处理记录", `${book.events.length} 条事件`);
      const events = element("div", "events");
      for (const event of [...book.events].reverse()) {
        const item = element("div", "event");
        item.append(element("strong", "", `${event.event_type} · ${event.stage}`), document.createTextNode(`  ${event.created_at}`));
        if (event.note) item.append(document.createElement("br"), document.createTextNode(event.note));
        events.append(item);
      }
      eventSection.append(events);
    }

    function createImagePageComposer(bookId, submitLabel, onComplete) {
      const panel = element("div", "image-page-composer");
      panel.append(element("p", "", "选择图片后，为每一张填写对应文本。图片按文件名中的数字排序；建议每段以完整句结束。"));
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/png,image/jpeg,image/webp";
      fileInput.multiple = true;
      fileInput.setAttribute("aria-label", "选择图片页面");
      const editors = element("div", "image-page-inputs");
      const actions = element("div", "actions");
      const submit = element("button", "primary", submitLabel);
      submit.type = "button";
      const previewUrls = [];
      let orderedFiles = [];
      fileInput.addEventListener("change", () => {
        previewUrls.forEach(url => URL.revokeObjectURL(url));
        previewUrls.length = 0;
        const collator = new Intl.Collator("zh-CN", { numeric: true, sensitivity: "base" });
        orderedFiles = [...fileInput.files].sort((left, right) => collator.compare(left.name, right.name));
        editors.replaceChildren();
        orderedFiles.forEach((file, index) => {
          const row = element("div", "image-page-input");
          const preview = document.createElement("img");
          preview.src = URL.createObjectURL(file);
          previewUrls.push(preview.src);
          preview.alt = `第 ${index + 1} 页图片预览`;
          const editor = element("div", "");
          const label = element("label", "", `第 ${index + 1} 页 · ${file.name}`);
          const textarea = document.createElement("textarea");
          textarea.required = true;
          textarea.placeholder = "输入这一页对应的朗读文本";
          textarea.setAttribute("aria-label", `第 ${index + 1} 页朗读文本`);
          editor.append(label, textarea);
          row.append(preview, editor);
          editors.append(row);
        });
      });
      submit.addEventListener("click", async () => {
        const pageTexts = [...editors.querySelectorAll("textarea")].map(textarea => textarea.value);
        if (!orderedFiles.length || pageTexts.length !== orderedFiles.length || pageTexts.some(text => !text.trim())) {
          messageNode.textContent = "请选择图片，并为每张图片填写对应文本";
          return;
        }
        submit.disabled = true;
        try {
          const form = new FormData();
          orderedFiles.forEach(file => form.append("images", file, file.name));
          form.append("page_texts", JSON.stringify(pageTexts));
          const result = await api(`/api/books/${bookId}/image-pages`, { method: "POST", body: form });
          messageNode.textContent = result.status === "queued"
            ? `已提交 ${result.appended_page_count ?? result.page_count} 页，正在处理`
            : result.job?.error || "页面已提交";
          await onComplete();
        } catch (error) {
          messageNode.textContent = error.message;
          submit.disabled = false;
        } finally {
          previewUrls.forEach(url => URL.revokeObjectURL(url));
        }
      });
      actions.append(submit);
      panel.append(fileInput, editors, actions);
      return panel;
    }

    async function openBook(bookId) {
      activeBookId = bookId;
      const book = await api(`/api/books/${bookId}`);
      activeStatus = book.status;
      listNode.querySelectorAll(".book-item").forEach(button => button.classList.remove("active"));
      const selected = [...listNode.querySelectorAll(".book-item")].find(button => button.dataset.bookId === book.id);
      selected?.classList.add("active");
      mainNode.replaceChildren();

      const top = element("div", "topline");
      const heading = document.createElement("div");
      heading.append(element("div", "eyebrow", "BOOK WORKFLOW"), element("h1", "", book.title));
      const refresh = element("button", "refresh", "刷新状态");
      refresh.type = "button";
      refresh.addEventListener("click", () => openBook(bookId));
      top.append(heading, refresh);
      mainNode.append(top);

      const status = element("div", "status-line");
      status.append(
        element("span", `status-dot${book.status.includes("review") ? " ready" : ""}`),
        element("span", "", `${textStatsLabel(book)} · ${workflowStageLabel(book.current_stage)} · ${workflowStatusLabel(book.status)}`),
      );
      mainNode.append(status);
      const workflowStatus = workflowStatusCopy(book);
      const workflowNotice = element("section", "workflow-status");
      workflowNotice.dataset.tone = workflowStatus.tone;
      workflowNotice.setAttribute("role", "status");
      workflowNotice.append(element("span", "workflow-status-mark"));
      const workflowMessage = element("div", "");
      workflowMessage.append(
        element("p", "workflow-status-title", workflowStatus.title),
        element("p", "workflow-status-detail", workflowStatus.detail),
      );
      workflowNotice.append(workflowMessage);
      if (workflowStatus.progress !== undefined && workflowStatus.progress !== null) {
        const progress = document.createElement("progress");
        progress.className = "workflow-progress";
        progress.max = 100;
        progress.value = workflowStatus.progress;
        progress.setAttribute("aria-label", "当前步骤处理进度");
        workflowNotice.append(progress);
      } else if (workflowStatus.indeterminate) {
        workflowNotice.append(element("span", "workflow-progress-indeterminate"));
      }
      mainNode.append(workflowNotice);
      if (["failed", "queue_unavailable"].includes(book.status)) {
        const retry = element("button", "secondary", "重试当前步骤");
        retry.type = "button";
        retry.addEventListener("click", async () => {
          try {
            if (book.current_stage === "document") await api(`/api/books/${bookId}/prepare-document`, { method: "POST" });
            else await api(`/api/books/${bookId}/jobs/${book.current_stage}`, { method: "POST" });
            await loadBooks();
          } catch (error) { messageNode.textContent = error.message; }
        });
        mainNode.append(retry);
      }
      const stageNames = ["pages_text", "reference", "preview", "final"];
      const stageFor = {
        pages_text: ["document", "pages_review", "text_review"],
        reference: ["reference", "reference_preparation", "reference_review"],
        preview: ["preview_audio", "preview_audio_update", "preview_audio_review", "preview_video", "preview_video_review"],
        final: ["full_audio", "full_audio_update", "final_audio_review", "full_video", "final_video_review", "complete"],
      };
      const currentIndex = Math.max(0, stageNames.findIndex(name => stageFor[name].includes(book.current_stage)));
      const tabLabels = ["页面和文本", "参考声音和词典", "预览", "全书成品"];
      const tabList = element("div", "workflow-tabs");
      tabList.setAttribute("role", "tablist");
      tabList.setAttribute("aria-label", "书籍处理阶段");
      const panels = Object.fromEntries(stageNames.map(name => [name, element("section", "workflow-panel")]));
      const initialTab = activeWorkflowTabs.get(bookId) || stageNames[currentIndex] || stageNames[0];
      const tabButtons = new Map();
      const selectTab = name => {
        activeWorkflowTabs.set(bookId, name);
        for (const [tabName, button] of tabButtons) {
          const selected = tabName === name;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
          panels[tabName].hidden = !selected;
        }
      };
      for (const [index, name] of stageNames.entries()) {
        const button = element("button", "workflow-tab", tabLabels[index]);
        button.type = "button";
        button.id = `workflow-tab-${name}`;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-controls", `workflow-panel-${name}`);
        button.addEventListener("click", () => selectTab(name));
        button.addEventListener("keydown", event => {
          const current = stageNames.indexOf(name);
          const next = event.key === "ArrowRight" ? (current + 1) % stageNames.length
            : event.key === "ArrowLeft" ? (current + stageNames.length - 1) % stageNames.length
              : event.key === "Home" ? 0 : event.key === "End" ? stageNames.length - 1 : -1;
          if (next < 0) return;
          event.preventDefault();
          const nextName = stageNames[next];
          tabButtons.get(nextName).focus();
          selectTab(nextName);
        });
        tabButtons.set(name, button);
        tabList.append(button);
        panels[name].id = `workflow-panel-${name}`;
        panels[name].setAttribute("role", "tabpanel");
        panels[name].setAttribute("aria-labelledby", button.id);
      }
      mainNode.append(tabList, ...Object.values(panels));
      selectTab(initialTab);

      if (book.current_stage === "document" && book.status === "awaiting_image_pages") {
        const section = addSection(panels.pages_text, "添加图片与文本", "每张图片对应一页朗读内容");
        const panel = createImagePageComposer(bookId, "上传页面并开始审核", () => loadBooks());
        section.append(panel);
        appendProcessingEvents(mainNode, book);
        return;
      }

      const images = latestPageImages(book);
      const textArtifact = latestArtifact(book, "text", "normalized_text");
      const isImageBook = book.artifacts.some(item => item.stage === "input" && item.kind === "source_page_texts");
      const hasActiveJob = book.jobs.some(job => ["queued", "running"].includes(job.status));
      const hasAudioHistory = book.artifacts.some(item =>
        item.kind === "audiobook_mp3" && ["preview_audio_review", "final_audio_review"].includes(item.stage),
      );
      if (textArtifact) {
        const pronunciationArtifact = latestArtifact(book, "pronunciation", "pronunciation_dict");
        const section = addSection(panels.reference, "人名读音词典", "为姓名或专有名词指定拼音；页面原文和分页对齐保持不变");
        const panel = element("form", "pronunciation-editor");
        const hint = element("p", "", "每个汉字对应一个拼音音节，使用数字声调 1–5，例如：单于读作 shan4 yu2。");
        const editor = document.createElement("textarea");
        editor.spellcheck = false;
        editor.setAttribute("aria-label", "人名读音词典 JSON");
        editor.value = pronunciationArtifact
          ? JSON.stringify(await (await fetch(pronunciationArtifact.url)).json(), null, 2)
          : "{}";
        editor.disabled = hasActiveJob;
        const save = element("button", "secondary", "保存读音词典");
        save.type = "submit";
        save.disabled = hasActiveJob;
        const feedback = element("p", "notice", pronunciationMessages.get(bookId) || "");
        feedback.setAttribute("role", "status");
        feedback.setAttribute("aria-live", "polite");
        editor.addEventListener("input", () => {
          pronunciationMessages.delete(bookId);
          feedback.textContent = "";
        });
        panel.append(hint, editor, save, feedback);
        panel.addEventListener("submit", async event => {
          event.preventDefault();
          let entries;
          try {
            entries = JSON.parse(editor.value);
            if (!entries || typeof entries !== "object" || Array.isArray(entries)) {
              throw new Error("词典必须是“姓名: 拼音”的 JSON 对象");
            }
          } catch (error) {
            feedback.textContent = error.message;
            return;
          }
          save.disabled = true;
          try {
            const result = await api(`/api/books/${bookId}/pronunciations`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ entries }),
            });
            pronunciationMessages.set(bookId, result.unchanged
              ? "读音词典没有变化"
              : "读音词典已保存；生成音频时会应用这些读音，请使用“生成与更新”按钮启动");
            await loadBooks();
          } catch (error) {
            feedback.textContent = error.message;
            save.disabled = false;
          }
        });
        section.append(panel);
      }
      const generationStages = new Set([
        "reference_preparation", "preview_audio", "preview_audio_update",
        "full_audio_update", "preview_video", "full_video",
      ]);
      if (!hasActiveJob && book.status === "ready" && generationStages.has(book.current_stage)) {
        const generationTab = book.current_stage === "reference_preparation" ? "reference"
          : ["preview_audio", "preview_audio_update", "preview_video"].includes(book.current_stage) ? "preview" : "final";
        const section = addSection(panels[generationTab], "生成与更新", "保存文字、替换图片或更新声音后，在这里统一启动受影响的处理步骤");
        const detail = book.current_stage === "reference_preparation"
          ? "先处理并审核新的参考音频，再生成书籍音频。"
          : ["preview_video", "full_video"].includes(book.current_stage)
            ? "页面图片有更新；只重渲染对应视频，保留现有音频。"
            : "文字或声音有更新；重新生成相应音频，审核通过后再继续视频流程。";
        section.append(element("p", "notice", detail));
        const generateActions = element("div", "button-row");
        generateActions.style.display = "flex";
        generateActions.style.gap = "8px";
        generateActions.style.flexWrap = "wrap";
        const regenerate = element(
          "button",
          "primary",
          book.current_stage === "reference_preparation"
            ? "处理参考音频"
            : hasAudioHistory
              ? "重新生成受影响内容"
              : "生成前五页试听",
        );
        regenerate.type = "button";
        regenerate.addEventListener("click", async () => {
          regenerate.disabled = true;
          try {
            const result = await api(`/api/books/${bookId}/regenerate`, { method: "POST" });
            messageNode.textContent = result.status === "queued" ? "已加入生成队列" : result.error || "已启动处理";
            await loadBooks();
          } catch (error) {
            messageNode.textContent = error.message;
            regenerate.disabled = false;
          }
        });

        const regenerateFromStart = element("button", "secondary", "重新生成全部音频");
        regenerateFromStart.type = "button";
        regenerateFromStart.addEventListener("click", async () => {
          regenerateFromStart.disabled = true;
          try {
            const result = await api(`/api/books/${bookId}/regenerate-from-start`, { method: "POST" });
            messageNode.textContent = result.status === "queued" ? "已加入全部音频生成队列" : result.error || "已开始重新生成全部音频";
            await loadBooks();
          } catch (error) {
            messageNode.textContent = error.message;
            regenerateFromStart.disabled = false;
          }
        });

        generateActions.append(regenerate, regenerateFromStart);
        section.append(generateActions);
      }
      let pageTexts = [];
      if (textArtifact) {
        pageTexts = (await (await fetch(textArtifact.url)).text()).split("<<<BOOK_PAGE_BREAK>>>").map(text => text.trim());
      }
      const savedPageNumbers = textArtifact?.metadata?.confirmed_pages;
      const confirmedPages = new Set(Array.isArray(savedPageNumbers)
        ? savedPageNumbers
        : ["reference", "reference_preparation", "reference_review", "preview_audio", "preview_audio_update",
          "preview_audio_review", "preview_video", "preview_video_review", "full_audio", "full_audio_update",
          "final_audio_review", "full_video", "final_video_review", "complete"].includes(book.current_stage)
          ? images.map(image => image.metadata.page)
          : []);
      if (images.length) {
        const reviewDetail = hasActiveJob
          ? `${images.length} 页 · 处理中暂不可编辑`
          : `${images.length} 页 · 已保存 ${confirmedPages.size}/${images.length} 页`;
        const section = addSection(panels.pages_text, "页面与朗读文本", reviewDetail);
        if (isImageBook) {
          const toggle = element("button", "secondary", "＋ 添加页面");
          toggle.type = "button";
          let composer = null;
          toggle.addEventListener("click", () => {
            if (composer) {
              composer.remove();
              composer = null;
              toggle.textContent = "＋ 添加页面";
              return;
            }
            composer = createImagePageComposer(bookId, "追加页面并更新审核", () => openBook(bookId));
            section.insertBefore(composer, grid);
            toggle.textContent = "取消添加";
          });
          section.append(toggle);
        }
        const grid = element("div", "page-grid");
        for (const [index, artifact] of images.entries()) {
          const pageNumber = artifact.metadata.page;
          const figure = element("figure", `page-item${textArtifact ? " has-text" : ""}`);
          const image = document.createElement("img");
          image.src = artifact.url;
          image.alt = `第 ${artifact.metadata.page} 页`;
          image.loading = "lazy";
          const zoomButton = element("button", "page-zoom");
          zoomButton.type = "button";
          zoomButton.setAttribute("aria-label", `放大查看第 ${artifact.metadata.page} 页`);
          zoomButton.addEventListener("click", () => openPageViewer(images, index));
          zoomButton.append(image);
          const footer = element("div", "page-item-footer");
          const replaceButton = element("button", "page-action", "替换图片");
          replaceButton.type = "button";
          replaceButton.disabled = hasActiveJob;
          replaceButton.addEventListener("click", () => fileInput.click());
          const fileInput = document.createElement("input");
          fileInput.type = "file";
          fileInput.accept = "image/png,image/jpeg,image/webp";
          fileInput.hidden = true;
          fileInput.setAttribute("aria-label", `选择第 ${artifact.metadata.page} 页的替换图片`);
          fileInput.addEventListener("change", async () => {
            const replacement = fileInput.files?.[0];
            if (!replacement) return;
            const confirmed = window.confirm(
              `用“${replacement.name}”替换第 ${artifact.metadata.page} 页图片吗？\n\n已有 F5 音频会保留，相关视频需重新渲染。`,
            );
            if (!confirmed) {
              fileInput.value = "";
              return;
            }
            replaceButton.disabled = true;
            try {
              const form = new FormData();
              form.append("image", replacement);
              const result = await api(
                `/api/books/${bookId}/pages/${artifact.metadata.page}/image`,
                { method: "POST", body: form },
              );
              messageNode.textContent = `第 ${artifact.metadata.page} 页已替换；请使用“生成与更新”中的统一按钮重新渲染视频`;
              await loadBooks();
            } catch (error) {
              messageNode.textContent = error.message;
            } finally {
              replaceButton.disabled = false;
              fileInput.value = "";
            }
          });
          const editTextButton = element("button", "page-action", "编辑文字");
          editTextButton.type = "button";
          editTextButton.disabled = hasActiveJob || !textArtifact;
          editTextButton.addEventListener("click", () => {
            editingBookId = bookId;
            editingPageNumber = pageNumber;
            editingPageText = pageTexts[pageNumber - 1] || "";
            pageTextDialogTitle.textContent = `编辑第 ${pageNumber} 页文字`;
            pageTextDialogInput.value = editingPageText;
            pageTextDialog.showModal();
            pageTextDialogInput.focus();
            pageTextDialogInput.setSelectionRange(0, 0);
            pageTextDialogInput.scrollTop = 0;
          });
          footer.append(replaceButton, editTextButton);
          const visual = element("div", "page-visual");
          visual.append(zoomButton, footer, fileInput);
          figure.append(visual, element("figcaption", "", `第 ${pageNumber} 页`));
          grid.append(figure);
        }
        section.append(grid);
        if (textArtifact && !hasActiveJob && confirmedPages.size < images.length
          && ["pages_review", "text_review"].includes(book.current_stage)) {
          const bulkActions = element("div", "actions");
          const saveAll = element("button", "primary", "保存全部文字并继续");
          saveAll.type = "button";
          saveAll.addEventListener("click", async () => {
            if (pageTexts.length !== images.length || pageTexts.some(text => !text.trim())) {
              messageNode.textContent = "部分页面缺少朗读文本，无法确认全部页面";
              return;
            }
            saveAll.disabled = true;
            try {
              const fullText = pageTexts.join("\n\n<<<BOOK_PAGE_BREAK>>>\n\n");
              const result = await api(`/api/books/${bookId}/text`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: fullText }),
              });
              messageNode.textContent = result.review_complete
                ? "全部页面文字已保存并确认，继续上传声音参考"
                : `已确认 ${result.confirmed_page_count}/${result.page_count} 页`;
              await loadBooks();
            } catch (error) {
              messageNode.textContent = error.message;
              saveAll.disabled = false;
            }
          });
          bulkActions.append(saveAll);
          section.append(bulkActions);
        }
      }

      if (textArtifact) {
        const checklistArtifact = latestArtifact(book, "pages", "checklist");
        if (checklistArtifact) {
          const checklist = await (await fetch(checklistArtifact.url)).json();
          if (checklist.items?.length) {
            const section = addSection(panels.pages_text, "朗读文本提醒", `${checklist.items.length} 项待检查`);
            const reviewPanel = element("div", "checklist-panel");
            reviewPanel.append(element("p", "", "这些图表标题未自动加入朗读文本；需要朗读的项目可加入对应页面。"));
            const list = element("ul", "checklist-list");
            for (const item of checklist.items) {
              const row = element("li", "checklist-item");
              row.append(element("span", "", `第 ${item.page} 页 · ${item.text}`));
              const includeButton = element("button", "", "加入文本");
              includeButton.type = "button";
              includeButton.disabled = hasActiveJob;
              includeButton.addEventListener("click", () => {
                const pageIndex = item.page - 1;
                if (pageIndex < 0 || pageIndex >= pageTexts.length || pageTexts[pageIndex].includes(item.text)) return;
                editingBookId = bookId;
                editingPageNumber = item.page;
                editingPageText = `${pageTexts[pageIndex]}\n\n${item.text}`.trim();
                pageTextDialogTitle.textContent = `编辑第 ${item.page} 页文字`;
                pageTextDialogInput.value = editingPageText;
                pageTextDialog.showModal();
                pageTextDialogInput.focus();
                pageTextDialogInput.setSelectionRange(0, 0);
                pageTextDialogInput.scrollTop = 0;
                includeButton.textContent = "编辑中";
                includeButton.disabled = true;
              });
              row.append(includeButton);
              list.append(row);
            }
            reviewPanel.append(list);
            section.append(reviewPanel);
          }
        }
      }

      const awaitingVoiceReference = ["reference", "reference_preparation"].includes(book.current_stage)
        && ["awaiting_reference", "ready"].includes(book.status);
      const legacyReviewCanContinue = ["pages_review", "text_review"].includes(book.current_stage)
        && ["awaiting_page_review", "awaiting_text_review"].includes(book.status);
      const existingVoiceSample = latestArtifact(book, "reference_input", "voice_sample");
      const canReplaceVoiceReference = Boolean(existingVoiceSample)
        && !["document", "pages_review", "text_review"].includes(book.current_stage);
      const readyToReprocessReference = book.current_stage === "reference_preparation" && book.status === "ready";
      const replacingVoiceReference = canReplaceVoiceReference && !legacyReviewCanContinue;
      if (awaitingVoiceReference || legacyReviewCanContinue || canReplaceVoiceReference || readyToReprocessReference) {
        const referenceDetail = readyToReprocessReference
          ? (existingVoiceSample
            ? "当前参考声音已准备好，可直接重新处理参考音，或上传新样本替换当前参考。"
            : "已准备好上传参考声音；上传后会自动进入参考音处理流程。")
          : replacingVoiceReference
          ? hasActiveJob
            ? "当前任务处理中，完成后可更换声音；更换后需重新确认参考音并生成音频/视频"
            : "更换后将重新处理参考音，旧音频和视频保留在历史中但不再作为当前成品"
          : legacyReviewCanContinue
          ? "上传声音样本后，将默认确认当前全部页面文字并继续处理"
          : "上传一段清晰、连续的声音，并填写与录音逐字对应的 REF_TEXT";
        const section = addSection(panels.reference, replacingVoiceReference ? "更换声音参考" : "声音参考", referenceDetail);
        const form = element("form", "reference-form");
        const voiceInput = document.createElement("input");
        voiceInput.type = "file";
        voiceInput.name = "voice";
        voiceInput.accept = ".wav,.mp3,.m4a,.flac,.ogg";
        voiceInput.required = true;
        voiceInput.setAttribute("aria-label", "声音采样文件");
        const transcript = document.createElement("textarea");
        transcript.name = "ref_text";
        transcript.placeholder = "输入录音中实际说出的准确文字";
        transcript.required = true;
        transcript.setAttribute("aria-label", "声音采样对应的 REF_TEXT");
        if (replacingVoiceReference) {
          const existingTranscript = latestArtifact(book, "reference_input", "ref_text");
          if (existingTranscript) transcript.value = await (await fetch(existingTranscript.url)).text();
        }
        const originalTranscript = transcript.value;
        const submit = element("button", "secondary", "保存参考声音");
        submit.type = "submit";
        const updateSubmitState = () => {
          submit.disabled = hasActiveJob
            || (!voiceInput.files.length && transcript.value === originalTranscript);
        };
        voiceInput.addEventListener("change", updateSubmitState);
        transcript.addEventListener("input", updateSubmitState);
        if (hasActiveJob) {
          voiceInput.disabled = true;
          transcript.disabled = true;
        }
        updateSubmitState();
        form.append(voiceInput, transcript, submit);
        form.addEventListener("submit", async event => {
          event.preventDefault();
          try {
            await api(`/api/books/${bookId}/reference`, { method: "POST", body: new FormData(form) });
            messageNode.textContent = "声音参考已保存；请使用“生成与更新”中的统一按钮处理参考音频";
            await loadBooks();
          } catch (error) { messageNode.textContent = error.message; }
        });
        section.append(form);
      }

      const processedReference = latestArtifact(book, "reference_review", "processed_audio");
      if (processedReference) {
        const section = addSection(panels.reference, "处理后的参考音频", "请试听处理结果并核对转写");
        const player = document.createElement("audio");
        player.controls = true;
        player.src = processedReference.url;
        player.className = "media-player";
        section.append(player);
        const transcriptArtifact = latestArtifact(book, "reference_review", "ref_text");
        if (transcriptArtifact) {
          const transcriptText = document.createElement("pre");
          transcriptText.textContent = await (await fetch(transcriptArtifact.url)).text();
          section.append(transcriptText);
        }
        if (book.current_stage === "reference_review" && book.status === "awaiting_reference_review") {
          const approve = element("button", "primary", "确认参考音频和 REF_TEXT");
          approve.type = "button";
          approve.addEventListener("click", () => approveStage(bookId, "reference", approve));
          section.append(approve);
        }
      }

      for (const [stage, kind, label, playerType, reviewStage, reviewStatus, approvalStage, approvalLabel] of [
        ["preview_audio_review", "audiobook_mp3", "前五页试听音频", "audio", "preview_audio_review", "awaiting_preview_audio_review", "preview_audio", "确认试听音频，生成预览视频"],
        ["preview_video_review", "video_mp4", "前五页预览视频", "video", "preview_video_review", "awaiting_preview_video_review", "preview_video", "确认预览，开始全书合成"],
        ["final_audio_review", "audiobook_mp3", "全书音频", "audio", "final_audio_review", "awaiting_final_audio_review", "final_audio", "确认全书音频，生成最终视频"],
        ["final_video_review", "video_mp4", "最终读书视频", "video", "final_video_review", "awaiting_final_video_review", "final_video", "确认最终视频"],
      ]) {
        const artifact = latestArtifact(book, stage, kind);
        if (!artifact) continue;
        const mediaTab = stage.startsWith("preview_") ? "preview" : "final";
        const section = addSection(panels[mediaTab], label, artifact.metadata.page_count ? `${artifact.metadata.page_count} 页` : "");
        const player = document.createElement(playerType);
        player.controls = true;
        player.src = artifact.url;
        player.className = "media-player";
        if (playerType === "video") player.playsInline = true;
        section.append(player);
        if (book.current_stage === reviewStage && book.status === reviewStatus) {
          const approve = element("button", "primary", approvalLabel);
          approve.type = "button";
          approve.addEventListener("click", () => approveStage(bookId, approvalStage, approve));
          section.append(approve);
        }
      }

      appendProcessingEvents(mainNode, book);
    }

    async function approveStage(bookId, stage, button) {
      if (button?.disabled) return;
      if (button) button.disabled = true;
      try {
        await api(`/api/books/${bookId}/approve`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stage }),
        });
        await loadBooks();
      } catch (error) {
        messageNode.textContent = error.message;
        if (button) button.disabled = false;
      }
    }

    async function startJob(bookId, stage) {
      try {
        await api(`/api/books/${bookId}/jobs/${stage}`, { method: "POST" });
        await loadBooks();
      } catch (error) { messageNode.textContent = error.message; }
    }

    document.querySelector("#upload-form").addEventListener("submit", async event => {
      event.preventDefault();
      const uploadForm = event.currentTarget;
      messageNode.textContent = "正在上传…";
      try {
        const form = new FormData();
        form.append("title", uploadForm.elements.title.value);
        let endpoint = "/api/books";
        if (uploadMode === "pdf") {
          form.append("pdf", uploadForm.elements.pdf.files[0]);
          const result = await api(endpoint, { method: "POST", body: form });
          messageNode.textContent = result.status === "queued" ? "已加入处理队列" : result.job.error;
          uploadForm.reset();
          activeBookId = result.id;
          await loadBooks();
        } else {
          form.append("title", uploadForm.elements.title.value);
          const result = await api("/api/books/image-books", {
            method: "POST",
            body: form,
          });
          messageNode.textContent = "书籍已创建，请在右侧添加图片和对应文本";
          uploadForm.reset();
          document.querySelector('[data-upload-mode="pdf"]').click();
          activeBookId = result.id;
          await loadBooks();
        }
      } catch (error) { messageNode.textContent = error.message; }
    });

    loadBooks().catch(error => { messageNode.textContent = error.message; });
    window.setInterval(() => {
      if (activeBookId && ["queued", "running", "preparing"].includes(activeStatus)) openBook(activeBookId).catch(() => {});
    }, 5000);
  </script>
</body>
</html>
