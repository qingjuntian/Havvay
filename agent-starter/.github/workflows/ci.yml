name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-starter:${{ github.sha }} .

      - name: Smoke test app inside container
        run: |
          docker run -d --rm --name agent-starter-ci -p 8000:8000 agent-starter:${{ github.sha }}
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs agent-starter-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f agent-starter-ci || true
