services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c 'if [ "$${DEBUGPY_ENABLED:-0}" = "1" ]; then exec python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload; else exec python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload; fi'
    ports:
      - "8000:8000"
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      ENV: production
      DEBUGPY_ENABLED: "${DEBUGPY_ENABLED:-0}"
      PYTHONPATH: /app
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - qdrant
    volumes:
      - ./src:/app/src

  qdrant:
    image: qdrant/qdrant:v1.7.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
    driver: local
